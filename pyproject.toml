[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acquire-macos-launcher"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["acquire_launcher*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
